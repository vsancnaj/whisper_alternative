<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="400" fill="#f3f4f6"/>

  <!-- Step 1: hotkey -->
  <g transform="translate(60,70)">
    <rect x="0" y="20" width="220" height="150" rx="16" fill="#ffffff" stroke="#d1d5db"/>
    <rect x="42" y="55" width="62" height="62" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
    <text x="73" y="96" text-anchor="middle" font-size="26" fill="#111827">⌃</text>
    <text x="128" y="96" text-anchor="middle" font-size="22" fill="#6b7280">+</text>
    <rect x="148" y="55" width="62" height="62" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
    <text x="179" y="97" text-anchor="middle" font-size="26" font-weight="600" fill="#111827">E</text>
    <text x="196" y="48" font-size="20" fill="#c084fc">✧</text>
    <text x="25" y="150" font-size="18" fill="#a855f7">✧</text>
    <text x="110" y="235" text-anchor="middle" font-size="16" fill="#9ca3af">1</text>
    <text x="110" y="262" text-anchor="middle" font-size="20" fill="#111827">Press your hotkey</text>
    <text x="110" y="286" text-anchor="middle" font-size="14" fill="#6b7280">a sparkle sound plays · recording starts</text>
  </g>

  <path d="M300 165 H340" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <path d="M334 159 L342 165 L334 171" stroke="#9ca3af" stroke-width="2" fill="none"/>

  <!-- Step 2: speak -->
  <g transform="translate(360,70)">
    <rect x="0" y="20" width="220" height="150" rx="16" fill="#ffffff" stroke="#d1d5db"/>
    <rect x="94" y="48" width="32" height="54" rx="16" fill="#111827"/>
    <path d="M82 92 a28 28 0 0 0 56 0" stroke="#111827" stroke-width="4" fill="none"/>
    <path d="M110 120 V134 M96 134 H124" stroke="#111827" stroke-width="4"/>
    <g stroke="#a855f7" stroke-width="3" stroke-linecap="round">
      <path d="M30 84 v12 M42 72 v36 M54 80 v20 M66 64 v52"/>
      <path d="M154 64 v52 M166 80 v20 M178 72 v36 M190 84 v12"/>
    </g>
    <text x="110" y="235" text-anchor="middle" font-size="16" fill="#9ca3af">2</text>
    <text x="110" y="262" text-anchor="middle" font-size="20" fill="#111827">Talk, then press again</text>
    <text x="110" y="286" text-anchor="middle" font-size="14" fill="#6b7280">English, Spanish, or any Whisper language</text>
  </g>

  <path d="M600 165 H640" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <path d="M634 159 L642 165 L634 171" stroke="#9ca3af" stroke-width="2" fill="none"/>

  <!-- Step 3: whisper.cpp on device -->
  <g transform="translate(660,70)">
    <rect x="0" y="20" width="220" height="150" rx="16" fill="#ffffff" stroke="#d1d5db"/>
    <rect x="70" y="55" width="80" height="80" rx="10" fill="#111827"/>
    <rect x="86" y="71" width="48" height="48" rx="6" fill="#374151"/>
    <g stroke="#9ca3af" stroke-width="3">
      <path d="M84 45 v10 M100 45 v10 M116 45 v10 M132 45 v10"/>
      <path d="M84 135 v10 M100 135 v10 M116 135 v10 M132 135 v10"/>
      <path d="M60 69 h10 M60 85 h10 M60 101 h10 M60 117 h10"/>
      <path d="M150 69 h10 M150 85 h10 M150 101 h10 M150 117 h10"/>
    </g>
    <text x="110" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="#f9fafb">whisper</text>
    <text x="110" y="235" text-anchor="middle" font-size="16" fill="#9ca3af">3</text>
    <text x="110" y="262" text-anchor="middle" font-size="20" fill="#111827">Transcribed on your Mac</text>
    <text x="110" y="286" text-anchor="middle" font-size="14" fill="#6b7280">whisper.cpp · offline · nothing uploaded</text>
  </g>

  <path d="M900 165 H940" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <path d="M934 159 L942 165 L934 171" stroke="#9ca3af" stroke-width="2" fill="none"/>

  <!-- Step 4: pasted at cursor -->
  <g transform="translate(960,70)">
    <rect x="0" y="20" width="220" height="150" rx="16" fill="#ffffff" stroke="#d1d5db"/>
    <rect x="22" y="48" width="176" height="94" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <rect x="34" y="64" width="120" height="8" rx="4" fill="#d1d5db"/>
    <rect x="34" y="82" width="150" height="8" rx="4" fill="#d1d5db"/>
    <rect x="34" y="100" width="90" height="8" rx="4" fill="#a855f7"/>
    <rect x="128" y="96" width="2" height="16" fill="#111827"/>
    <text x="110" y="235" text-anchor="middle" font-size="16" fill="#9ca3af">4</text>
    <text x="110" y="262" text-anchor="middle" font-size="20" fill="#111827">Text appears at the cursor</text>
    <text x="110" y="286" text-anchor="middle" font-size="14" fill="#6b7280">any app · any text field</text>
  </g>
</svg>
